version: "3.9"
services:
  dev-environment:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuda_dev_env
    ports:
      - "8886:8888" # JupyterLabポート
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    volumes:
      - ./workspace:/workspace # ホストとコンテナの共有フォルダ
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    shm_size: "16g" # 大きなデータ処理のための共有メモリサイズ
